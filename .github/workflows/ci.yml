name: CI

# Läuft bei jedem Push und jedem Pull Request. Die Reihenfolge ist Absicht:
# zuerst die schnellen Prüfungen (Lint, Typen, Unit-Tests), erst danach der
# teure Build — so kommt die Rückmeldung bei einem Tippfehler in Sekunden.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruefen:
    name: Lint, Typen und Tests
    runs-on: ubuntu-latest

    # Echtes Postgres für den Schema-Test: RLS und Trigger lassen sich nicht
    # sinnvoll nachbilden, und genau dort liegt das Risiko.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sicherheitslücken in den Abhängigkeiten
        # Nur was wirklich ausgeliefert wird. Die Entwicklungswerkzeuge
        # (Tailwind 3, ESLint) schleppen Meldungen zu Glob-Bibliotheken mit,
        # die beim Bauen laufen und keine Nutzereingabe sehen; sie liessen
        # sich nur mit einem Tailwind-4-Umstieg beheben. Was beim Nutzer
        # ankommt, muss dagegen sauber sein — und bleibt es nur, wenn es
        # jemand prüft.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typen
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Schema, Trigger und RLS
        run: npm run test:db
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Build
        run: npm run build
        env:
          # Der Build darf keine echten Zugangsdaten brauchen. Die Prüfung
          # der Variablen passiert absichtlich erst zur Laufzeit.
          NEXT_PUBLIC_SUPABASE_URL: https://beispiel.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: beispiel
          # Muss gesetzt sein: ohne sie bricht der Build inzwischen ab, damit
          # in Produktion keine Bestätigungslinks auf localhost zeigen.
          NEXT_PUBLIC_SITE_URL: https://beispiel.baustift.de

  # Die E-Rechnung gegen die offiziellen Regelwerke. Eigener Job, weil er
  # Java braucht und rund eine Minute lädt. Alle fremden Bestandteile sind
  # auf feste Stände genagelt (siehe scripts/erechnung-pruefen.sh) — sonst
  # hinge das Ergebnis davon ab, welcher Tag gerade ist.
  erechnung:
    name: E-Rechnung gegen EN 16931
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: xmllint bereitstellen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm ci
      - run: npm run erechnung

  # Eigener Job, weil er nochmal baut — dafür prüft er als Einziger die
  # gebaute Anwendung. Der Fehler, der die PDF-Ausgabe wochenlang lahmgelegt
  # hat, war in Vitest nicht sichtbar und hier sofort.
  rauchtest:
    name: Gebaute Anwendung antwortet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rauch
