<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Baustift</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f3efe7;
        color: #1b1a17;
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #5f5a50; margin: 0 0 24px; max-width: 32ch; }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 20px;
        background: #1b1a17;
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Keine Verbindung</h1>
      <p>Auf der Baustelle passiert das. Sobald du wieder Netz hast, geht es weiter.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
